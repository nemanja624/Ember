name: CI 

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lebron
          POSTGRES_PASSWORD: lbj6kd35kb24dw3
          POSTGRES_DB: ember
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://lebron:lbj6kd35kb24dw3@localhost:5432/ember?schema=public"
      JWT_ACCESS_SECRET: ci_access_secret_placeholder_12345
      JWT_REFRESH_SECRET: ci_refresh_secret_placeholder_12345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --dir apps/backend exec prisma generate

      - name: Push Database Schema (Prisma DB Push)
        run: pnpm --dir apps/backend exec prisma db push

      - name: TypeScript check
        run: pnpm --dir apps/backend exec tsc --noEmit

      - name: Run tests
        run: pnpm --dir apps/backend test
